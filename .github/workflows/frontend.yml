name: Frontend CI/CD

on:
  push:
    branches:
      - main

jobs:
  frontend:
    runs-on: [self-hosted, docker, ubuntu-24.04]

    steps:

      # ==========================================
      # 1. Checkout source code
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Login to Docker Hub
      # ==========================================
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}


      # ==========================================
      # 3. Build Angular + Docker image
      # ==========================================
      - name: Build Docker image
        run: |
          docker build \
            -t mendax1/e-comfront:latest \
            -t mendax1/e-comfront:${{ github.sha }} .


      # ==========================================
      # 4. Push latest image
      # ==========================================
      - name: Push latest image
        run: |
          docker push mendax1/e-comfront:latest


      # ==========================================
      # 5. Push commit-specific image
      # ==========================================
      - name: Push commit image
        run: |
          docker push mendax1/e-comfront:${{ github.sha }}

