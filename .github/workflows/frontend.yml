name: Frontend CI/CD

on:
  push:
    branches:
      - main

jobs:
  frontend:
    runs-on: [self-hosted, docker, ubuntu-24.04]

    steps:
      # 1. Checkout source code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Run ESLint
      - name: Run ESLint
        run: npm run lint

      # 5. Build Angular application
      - name: Build Angular application
        run: npm run build

      # 6. Login to Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 7. Build Docker image
      - name: Build Docker image
        run: |
          docker build \
            -t mendax1/e-comfront:latest \
            -t mendax1/e-comfront:${{ github.sha }} .

      # 8. Push latest image
      - name: Push latest image
        run: |
          docker push mendax1/e-comfront:latest

      # 9. Push commit image
      - name: Push commit image
        run: |
          docker push mendax1/e-comfront:${{ github.sha }}

      # 10. Update GitOps repository
      - name: Update GitOps repository
        env:
          GITOPS_TOKEN: ${{ secrets.GITOPS_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          git clone https://x-access-token:${GITOPS_TOKEN}@github.com/mekkiamine/E-ComK8s.git gitops
          cd gitops
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          sed -i \
            "s|image: mendax1/e-comfront:.*|image: mendax1/e-comfront:${IMAGE_TAG}|" \
            apps/frontend/deployment.yaml

          git add apps/frontend/deployment.yaml
          git commit -m "update frontend image to ${IMAGE_TAG}" || echo "No changes to commit"
          git push origin main
