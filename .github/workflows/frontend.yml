name: Frontend CI/CD

on:
  push:
    branches:
      - main

jobs:
  frontend:
    runs-on: [self-hosted, docker, ubuntu-24.04]

    steps:

      # ==========================================
      # 1. Checkout source code
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Check environment
      # ==========================================
      - name: Check environment
        run: |
          echo "=== Runner information ==="
          uname -a

          echo "=== Docker ==="
          docker --version

          echo "=== Node on host ==="
          node --version || true

          echo "=== npm on host ==="
          npm --version || true


      # ==========================================
      # 3. Install dependencies + build Angular
      #    inside Node 22 container
      # ==========================================
      - name: Build Angular
        run: |
          docker run --rm \
            -v "$PWD:/app" \
            -w /app \
            node:22-alpine \
            sh -c "npm ci && npm run build"


      # ==========================================
      # 4. Verify Angular build
      # ==========================================
      - name: Verify Angular build
        run: |
          echo "Checking Angular build output..."

          if [ ! -d "dist/ecomfront/browser" ]; then
            echo "ERROR: Angular build output not found!"
            exit 1
          fi

          echo "Angular build successful!"
          ls -la dist/ecomfront/browser


      # ==========================================
      # 5. Login to Docker Hub
      # ==========================================
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}


      # ==========================================
      # 6. Build Docker image
      # ==========================================
      - name: Build Docker image
        run: |
          docker build \
            -t mendax1/e-comfront:latest \
            -t mendax1/e-comfront:${{ github.sha }} .


      # ==========================================
      # 7. Push latest image
      # ==========================================
      - name: Push latest image
        run: |
          docker push mendax1/e-comfront:latest


      # ==========================================
      # 8. Push commit-specific image
      # ==========================================
      - name: Push commit image
        run: |
          docker push mendax1/e-comfront:${{ github.sha }}

