name: Frontend CI/CD

on:
  push:
    branches:
      - main

jobs:
  frontend:

    runs-on: [self-hosted, docker, ubuntu-24.04]

    steps:

      # ==========================================
      # 1. Checkout source code
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Setup Node.js
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm


      # ==========================================
      # 3. Install dependencies
      # ==========================================
      - name: Install packages
        run: npm ci


      # ==========================================
      # 4. Check formatting
      # ==========================================
      - name: Check formatting
        run: npm run format:check


      # ==========================================
      # 5. Build Angular application
      # ==========================================
      - name: Build Angular
        run: npm run build


      # ==========================================
      # 6. Login to Docker Hub
      # ==========================================
      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}


      # ==========================================
      # 7. Build Docker image
      # ==========================================
      - name: Build Docker image
        run: |
          docker build \
            -t mendax1/e-comfront:latest \
            -t mendax1/e-comfront:${{ github.sha }} .


      # ==========================================
      # 8. Push Docker images
      # ==========================================
      - name: Push images
        run: |
          docker push mendax1/e-comfront:latest
          docker push mendax1/e-comfront:${{ github.sha }}
